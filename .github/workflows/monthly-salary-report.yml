name: Monthly Salary Report

on:
  schedule:
    # 18:00 KST on days that may be month-end. The script exits unless it is
    # actually the last day of the month in Asia/Seoul.
    - cron: "0 9 28-31 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Report month in YYYY-MM format. Empty means current KST month."
        required: false
        type: string
      force:
        description: "Send even if this month was already marked sent."
        required: false
        default: false
        type: boolean

jobs:
  send-report:
    runs-on: ubuntu-latest
    env:
      REPORT_TIME_ZONE: Asia/Seoul
      PAYMENTS_COLLECTION: Payments
      RUN_LOG_COLLECTION: salaryReportRuns
      PAYMENT_DATE_FIELD: paymentDate
      YEAR_FIELD: Year
      MONTH_FIELD: Month
      TOTAL_PAY_FIELD: Salary
      UPDATED_AT_FIELD: updatedAt
      DEDUPE_KEY_FIELDS: employeeId,payPeriod
      GOOGLE_SHEETS_SPREADSHEET_ID: 1mKjEd__zIoMJaa6CLmDE-wALGhtlG-USLTAiQBZnioc
      SALARY_SPREADSHEET_ID: ${{ secrets.SALARY_SPREADSHEET_ID || '1mKjEd__zIoMJaa6CLmDE-wALGhtlG-USLTAiQBZnioc' }}
      SALARY_WRITE_RANGE: ${{ vars.SALARY_WRITE_RANGE || 'Salary!A1' }}
      SALARY_CLEAR_RANGE: ${{ vars.SALARY_CLEAR_RANGE || 'Salary!A:AA' }}
      SALARY_MONTH_CELL: ${{ vars.SALARY_MONTH_CELL }}
      SALARY_TOTAL_CELL: ${{ vars.SALARY_TOTAL_CELL }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
      MAIL_HOST: ${{ secrets.MAIL_HOST || 'smtp.gmail.com' }}
      MAIL_PORT: ${{ secrets.MAIL_PORT || '465' }}
      MAIL_SECURE: ${{ secrets.MAIL_SECURE || 'true' }}
      MAIL_USER: ${{ secrets.MAIL_USER || secrets.GMAIL_USERNAME }}
      MAIL_PASS: ${{ secrets.MAIL_PASS || secrets.GMAIL_APP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM || secrets.GMAIL_USERNAME }}
      MAIL_TO: sjchoi787@gmail.com
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install salary report runtime dependencies
        run: |
          rm -rf node_modules /tmp/salary-runtime
          python -m pip install --upgrade openpyxl
          npm install --prefix /tmp/salary-runtime --no-package-lock --omit=dev firebase-admin@13.10.0 googleapis@131.0.0 nodemailer@9.0.3
          ln -s /tmp/salary-runtime/node_modules node_modules

      - name: Send monthly salary report
        run: |
          args=()
          if [ -n "${{ inputs.month }}" ]; then
            args+=("--month=${{ inputs.month }}")
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ inputs.force }}" = "true" ]; then
            args+=("--force")
          fi
          node scripts/sendMonthlySalaryReport.mjs "${args[@]}"

      - name: Upload salary report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: monthly-salary-report
          path: artifacts/salary-reports/*.xlsx
          if-no-files-found: ignore
