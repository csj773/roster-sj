name: Inspect Slack PerDiem Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-perdiem-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[inspect-perdiem-once]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm install

      - name: Inspect PerDiem from Firestore pdc
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_UID: guest_email_sjchoi787_gmail_com
          PERDIEM_USER_NAME: sjchoi787@gmail.com
          PERDIEM_TARGET_MONTH: "7"
          PERDIEM_TARGET_YEAR: "2026"
        run: node scripts/slack_monthly_perdiem_report.mjs

      - name: Inspect raw pdc events
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module <<'NODE'
          import admin from "firebase-admin";

          function parseJsonEnv(name) {
            const raw = String(process.env[name] || "").trim()
              .replace(/^\uFEFF/, "")
              .replace(/[“”]/g, "\"")
              .replace(/[‘’]/g, "'")
              .replace(/-----BEGIN PRIVATE KEY[—–-]+/g, "-----BEGIN PRIVATE KEY-----")
              .replace(/[—–-]+END PRIVATE KEY[—–-]+/g, "-----END PRIVATE KEY-----");
            const parsed = JSON.parse(raw);
            if (parsed.private_key) parsed.private_key = parsed.private_key.replace(/\\n/g, "\n");
            return parsed;
          }

          admin.initializeApp({ credential: admin.credential.cert(parseJsonEnv("FIREBASE_SERVICE_ACCOUNT")) });
          const db = admin.firestore();
          const owner = "guest_email_sjchoi787_gmail_com";
          const activities = new Set(["YP151", "YP152", "YP135", "YP136", "YP801", "YP802", "YP131"]);
          const snap = await db.collection("pdc").doc(owner).collection("events").get();
          const rows = snap.docs
            .map((doc) => doc.data())
            .filter((row) => activities.has(String(row.Activity || "").toUpperCase()))
            .sort((a, b) => `${a.Activity}_${a.Date}_${a.STDZ}`.localeCompare(`${b.Activity}_${b.Date}_${b.STDZ}`));
          console.log(`pdc events=${snap.size} matching=${rows.length}`);
          for (const row of rows) {
            console.log([
              row.Date,
              row.Activity,
              row.From,
              row.To,
              `STDL=${row.STDL}`,
              `STDZ=${row.STDZ}`,
              `STAL=${row.STAL}`,
              `STAZ=${row.STAZ}`,
              `summary=${String(row.sourceSummary || "").slice(0, 80)}`,
            ].join(" | "));
          }
          NODE

      - name: Inspect source iCal events
        env:
          INPUT_ICAL_ROSTER_URL: ${{ secrets.ICAL_ROSTER_URL || secrets.WEB_ROSTER_URL }}
        run: |
          node --input-type=module <<'NODE'
          function fetchableCalendarUrl(value) {
            const text = String(value || "").trim();
            if (/^webcal:\/\//i.test(text)) return `https://${text.slice("webcal://".length)}`;
            if (/^https:\/\//i.test(text)) return text;
            return "";
          }

          function unfoldIcsLines(text) {
            const lines = String(text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
            const unfolded = [];
            for (const line of lines) {
              if (/^[ \t]/.test(line) && unfolded.length) unfolded[unfolded.length - 1] += line.slice(1);
              else unfolded.push(line);
            }
            return unfolded;
          }

          function decodeIcsText(value) {
            return String(value || "")
              .replace(/\\n/gi, "\n")
              .replace(/\\,/g, ",")
              .replace(/\\;/g, ";")
              .replace(/\\\\/g, "\\")
              .trim();
          }

          function parseIcsValue(line) {
            const colon = line.indexOf(":");
            if (colon < 0) return null;
            const keyPart = line.slice(0, colon);
            const value = line.slice(colon + 1);
            const [name] = keyPart.split(";");
            return { name: name.toUpperCase(), value: decodeIcsText(value) };
          }

          function parseIcsEvents(text) {
            const events = [];
            let current = null;
            for (const line of unfoldIcsLines(text)) {
              if (line.trim() === "BEGIN:VEVENT") {
                current = {};
                continue;
              }
              if (line.trim() === "END:VEVENT") {
                if (current) events.push(current);
                current = null;
                continue;
              }
              if (!current) continue;
              const parsed = parseIcsValue(line);
              if (parsed) current[parsed.name] = parsed.value;
            }
            return events;
          }

          const url = fetchableCalendarUrl(process.env.INPUT_ICAL_ROSTER_URL);
          if (!url) throw new Error("missing INPUT_ICAL_ROSTER_URL");
          const response = await fetch(url, { headers: { Accept: "text/calendar, text/plain, */*" } });
          if (!response.ok) throw new Error(`fetch failed ${response.status}`);
          const ics = await response.text();
          const activities = new Set(["YP151", "YP152", "YP135", "YP136", "YP801", "YP802", "YP131"]);
          const events = parseIcsEvents(ics).filter((event) => {
            const text = `${event.SUMMARY || ""}\n${event.DESCRIPTION || ""}`;
            return [...activities].some((activity) => text.includes(activity));
          });
          console.log(`source iCal matching=${events.length}`);
          for (const event of events) {
            const description = String(event.DESCRIPTION || "")
              .split("\n")
              .map((line) => line.trim())
              .filter(Boolean)
              .slice(0, 12)
              .join(" / ");
            console.log([
              `SUMMARY=${event.SUMMARY || ""}`,
              `DTSTART=${event.DTSTART || ""}`,
              `DTEND=${event.DTEND || ""}`,
              `LOCATION=${event.LOCATION || ""}`,
              `DESC=${description.slice(0, 500)}`,
            ].join(" | "));
          }
          NODE
