name: Sync Pilotlog to Google Sheets

on:
  schedule:
    # Every 6 hours at 00:00, 06:00, 12:00, and 18:00 UTC.
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

jobs:
  sync-pilotlog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install sync dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm install --no-audit --no-fund

      - name: Sync Firestore Pilotlog to flt_log
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          PILOTLOG_SPREADSHEET_ID: ${{ secrets.PILOTLOG_SPREADSHEET_ID || '1mKjEd__zIoMJaa6CLmDE-wALGhtlG-USLTAiQBZnioc' }}
          PILOTLOG_SHEET_NAME: flt_log
          PILOTLOG_COLLECTION: Pilotlog
          PILOTLOG_EMAIL: sjchoi787@gmail.com
        run: |
          node --input-type=module <<'NODE'
          import admin from "firebase-admin";
          import { google } from "googleapis";
          import { randomUUID } from "node:crypto";

          const DEFAULT_EMAIL = "sjchoi787@gmail.com";
          const DEFAULT_COLLECTION = "Pilotlog";
          const DEFAULT_SHEET_NAME = "flt_log";

          const email = process.env.PILOTLOG_EMAIL || DEFAULT_EMAIL;
          const collectionName = process.env.PILOTLOG_COLLECTION || DEFAULT_COLLECTION;
          const sheetName = process.env.PILOTLOG_SHEET_NAME || DEFAULT_SHEET_NAME;
          const spreadsheetIdFromEnv =
            process.env.PILOTLOG_SPREADSHEET_ID ||
            process.env.GOOGLE_SHEETS_SPREADSHEET_ID ||
            "1mKjEd__zIoMJaa6CLmDE-wALGhtlG-USLTAiQBZnioc";

          function requiredJsonEnv(name) {
            const raw = process.env[name];
            if (!raw) {
              throw new Error(`${name} secret is required`);
            }

            const parsed = JSON.parse(raw);
            if (parsed.private_key) {
              parsed.private_key = parsed.private_key.replace(/\\n/g, "\n");
            }
            return parsed;
          }

          function normalizeFirestoreValue(value) {
            if (value == null) return "";

            if (typeof value.toDate === "function") {
              return value.toDate();
            }

            if (value instanceof Date) {
              return value.toISOString();
            }

            if (Array.isArray(value)) {
              return value
                .map((item) => {
                  const normalized = normalizeFirestoreValue(item);
                  return typeof normalized === "string" ? normalized : JSON.stringify(normalized);
                })
                .join(", ");
            }

            if (typeof value === "object") {
              return JSON.stringify(value);
            }

            return value;
          }

          function formatDate(value) {
            const normalized = normalizeFirestoreValue(value);
            if (!normalized) return "";

            const date =
              normalized instanceof Date
                ? normalized
                : typeof normalized === "number"
                  ? new Date(Math.round((normalized - 25569) * 86400 * 1000))
                  : new Date(normalized);

            if (Number.isNaN(date.getTime())) return String(normalized);
            return `${date.getUTCFullYear()}. ${date.getUTCMonth() + 1}. ${date.getUTCDate()}`;
          }

          function formatMonthNumber(value) {
            const raw = String(normalizeFirestoreValue(value) || "").trim();
            if (!raw) return "";

            const numeric = Number(raw);
            if (Number.isInteger(numeric) && numeric >= 1 && numeric <= 12) return numeric;

            const monthNames = {
              JAN: 1,
              JANUARY: 1,
              FEB: 2,
              FEBRUARY: 2,
              MAR: 3,
              MARCH: 3,
              APR: 4,
              APRIL: 4,
              MAY: 5,
              JUN: 6,
              JUNE: 6,
              JUL: 7,
              JULY: 7,
              AUG: 8,
              AUGUST: 8,
              SEP: 9,
              SEPT: 9,
              SEPTEMBER: 9,
              OCT: 10,
              OCTOBER: 10,
              NOV: 11,
              NOVEMBER: 11,
              DEC: 12,
              DECEMBER: 12,
            };

            return monthNames[raw.toUpperCase()] || raw;
          }

          function normalizeDateKey(value) {
            const raw = normalizeFirestoreValue(value);
            if (!raw) return "";
            const formatted = formatDate(raw);
            return String(formatted || raw).replace(/\s+/g, "").replace(/\.$/, "");
          }

          function valueByKeys(data, keys) {
            for (const key of keys) {
              if (data[key] != null && data[key] !== "") return data[key];
            }
            return "";
          }

          function normalizeFlightNumber(value) {
            const raw = normalizeFirestoreValue(value);
            return raw == null ? "" : String(raw).trim().replace(/^YP/i, "");
          }

          function normalizeKeyPart(value) {
            return String(normalizeFirestoreValue(value) || "").trim().toUpperCase();
          }

          function normalizeCell(value) {
            const normalized = normalizeFirestoreValue(value);
            if (normalized instanceof Date) return normalized.toISOString();
            return normalized == null ? "" : normalized;
          }

          function sortValue(data) {
            const candidate = data.Date || data.date || data.flightDate || data.createdAt || data.updatedAt;
            if (!candidate) return 0;

            if (typeof candidate.toDate === "function") return candidate.toDate().getTime();
            const parsed = new Date(candidate).getTime();
            return Number.isNaN(parsed) ? 0 : parsed;
          }

          function timestampMillis(value) {
            if (!value) return 0;
            if (typeof value.toDate === "function") return value.toDate().getTime();
            if (value instanceof Date) return value.getTime();
            const parsed = new Date(value).getTime();
            return Number.isNaN(parsed) ? 0 : parsed;
          }

          function writeSortValue(data) {
            return Math.max(
              timestampMillis(data.updatedAt),
              timestampMillis(data.UpdatedAt),
              timestampMillis(data.updateTime),
              timestampMillis(data.createdAt),
              timestampMillis(data.CreatedAt),
              timestampMillis(data.createTime),
              data.__updateMillis || 0,
              data.__createMillis || 0
            );
          }

          function buildKeyFromRow(headers, row) {
            const valueAt = (name, predicate = () => true) => {
              const index = headers.findIndex((header, headerIndex) => String(header).trim() === name && predicate(headerIndex));
              return index >= 0 ? row[index] || "" : "";
            };

            return [
              normalizeDateKey(valueAt("DATE")),
              normalizeFlightNumber(valueAt("FLT")),
              normalizeKeyPart(valueAt("FROM")),
              normalizeKeyPart(valueAt("TO", (index) => index <= 5)),
              normalizeKeyPart(valueAt("REG")),
            ].join("|");
          }

          function buildKeyFromData(data) {
            return [
              normalizeDateKey(valueByKeys(data, ["Date", "DATE", "date", "flightDate"])),
              normalizeFlightNumber(valueByKeys(data, ["FLT", "F", "Activity", "flightNo"])),
              normalizeKeyPart(valueByKeys(data, ["FROM", "From", "from"])),
              normalizeKeyPart(valueByKeys(data, ["TO", "To", "to"])),
              normalizeKeyPart(valueByKeys(data, ["REG", "Reg", "A/C ID", "AcReg"])),
            ].join("|");
          }

          function valueForHeader(header, index, data) {
            const name = String(header || "").trim();

            if (name === "NAME") return valueByKeys(data, ["NAME", "Name", "name"]);
            if (name === "EMPNO" || name === "EMP NO") return valueByKeys(data, ["EMPNO", "EMP NO", "EmpNo"]);
            if (name === "DATE") return formatDate(valueByKeys(data, ["Date", "DATE", "date", "flightDate"]));
            if (name === "FLT" || name === "FLT NO") return normalizeFlightNumber(valueByKeys(data, ["FLT", "F", "Activity", "flightNo"]));
            if (name === "FROM") return valueByKeys(data, ["FROM", "From", "from"]);

            // flt_log has two TO columns: route destination near the front, and takeoff time later.
            if (name === "TO" && index <= 5) return valueByKeys(data, ["TO", "To", "to"]);
            if (name === "TO") return valueByKeys(data, ["TO_TIME", "TKO", "TakeOff", "TO 2"]);

            if (name === "REG") return valueByKeys(data, ["REG", "Reg", "A/C ID", "AcReg"]);
            if (name === "DC") return valueByKeys(data, ["DC", "A/C Type"]);
            if (name === "RO") return valueByKeys(data, ["RO", "StartL", "STDl", "STDL"]);
            if (name === "RI") return valueByKeys(data, ["RI", "FinishL", "STAl", "STAL"]);
            if (name === "BLK") return valueByKeys(data, ["BLK", "BLH", "BH", "Blockhours"]);
            if (name === "LD") return valueByKeys(data, ["LD", "LDG", "Landing"]);
            if (name === "ACT") return valueByKeys(data, ["ACT", "ET"]);
            if (name === "NGT" || name === "NT") return valueByKeys(data, ["NGT", "NT"]);
            if (name === "INS" || name === "INST") return valueByKeys(data, ["INS", "INST"]);
            if (name === "이륙") return valueByKeys(data, ["이륙", "TKO", "TakeOff"]);
            if (name === "착륙") return valueByKeys(data, ["착륙", "LDG", "Landing"]);
            if (name === "자동착륙") return valueByKeys(data, ["자동착륙", "AutoLanding"]);
            if (name === "TOGA") return valueByKeys(data, ["TOGA"]);
            if (name === "PIC" || name === "PIC_com") return valueByKeys(data, [name, "PIC"]);
            if (name === "EX") return valueByKeys(data, ["EX", "DH"]);
            if (name === "BLH" || name === "비행시간") return valueByKeys(data, [name, "BLK", "BLH", "BH"]);
            if (name === "연장시간") return valueByKeys(data, ["연장시간", "ET"]);
            if (name.includes("야간")) return valueByKeys(data, [name, "NGT", "NT"]);
            if (name === "remark" || name === "Remarks") return valueByKeys(data, ["remark", "Remarks"]);
            if (name === "Destination") return valueByKeys(data, ["Destination", "TO", "To"]);
            if (name === "Destination ") return valueByKeys(data, ["Destination ", "Destination", "TO", "To"]);
            if (name === "YEAR") return valueByKeys(data, ["YEAR", "Year"]);
            if (name === "MONTH") return formatMonthNumber(valueByKeys(data, ["MONTH", "Month"]));
            if (name === "MONTH ") return formatMonthNumber(valueByKeys(data, ["MONTH ", "MONTH", "Month"]));
            if (name === "CAP") return valueByKeys(data, ["CAP"]);
            if (name === "ID") return data.generatedId;

            return valueByKeys(data, [name]);
          }

          function rowFingerprint(row, width) {
            return Array.from({ length: width }, (_, index) => String(row[index] ?? "").trim()).join("\u001f");
          }

          function existingIdForRow(headers, row) {
            const idIndex = headers.findIndex((header) => String(header).trim().toUpperCase() === "ID");
            return idIndex >= 0 ? String(row[idIndex] || "").trim() : "";
          }

          function buildRowFromData(headers, data, generatedId) {
            return headers.map((header, index) => normalizeCell(valueForHeader(header, index, { ...data, generatedId })));
          }

          function buildFirestoreRowsByKey(headers, docs) {
            const rowsByKey = new Map();
            let duplicateFirestoreRows = 0;

            docs
              .map((doc) => ({
                docId: doc.id,
                generatedId: randomUUID().replace(/-/g, "").slice(0, 8),
                __createMillis: doc.createTime?.toDate?.().getTime?.() || 0,
                __updateMillis: doc.updateTime?.toDate?.().getTime?.() || 0,
                ...doc.data(),
              }))
              .sort((a, b) => sortValue(a) - sortValue(b))
              .forEach((data) => {
                const key = buildKeyFromData(data);
                if (!key || key === "||||") return;
                const existing = rowsByKey.get(key);
                if (existing) {
                  duplicateFirestoreRows += 1;
                  if (writeSortValue(existing.data) > writeSortValue(data)) return;
                }
                rowsByKey.set(key, { data });
              });

            return { rowsByKey, duplicateFirestoreRows };
          }

          function columnLetter(columnNumber) {
            let value = columnNumber;
            let letters = "";
            while (value > 0) {
              const mod = (value - 1) % 26;
              letters = String.fromCharCode(65 + mod) + letters;
              value = Math.floor((value - mod) / 26);
            }
            return letters;
          }

          async function resolveSheetId(sheets, spreadsheetId, title) {
            const metadata = await sheets.spreadsheets.get({
              spreadsheetId,
              fields: "sheets.properties",
            });
            const sheet = (metadata.data.sheets || []).find((item) => item.properties?.title === title);
            if (!sheet) throw new Error(`Sheet not found: ${title}`);
            return sheet.properties.sheetId;
          }

          function buildExistingRowsByKey(headers, rows) {
            const rowsByKey = new Map();
            const duplicateRowNumbers = [];
            let duplicateSheetRows = 0;
            rows.forEach((row, index) => {
              const key = buildKeyFromRow(headers, row);
              if (!key || key === "||||") return;
              if (rowsByKey.has(key)) {
                duplicateSheetRows += 1;
                duplicateRowNumbers.push(index + 3);
                return;
              }
              rowsByKey.set(key, { row, rowNumber: index + 3 });
            });
            return { rowsByKey, duplicateSheetRows, duplicateRowNumbers };
          }

          function mergeSheetRows(headers, existingRows, firestoreRowsByKey) {
            const { rowsByKey: existingRowsByKey, duplicateSheetRows, duplicateRowNumbers } = buildExistingRowsByKey(headers, existingRows);
            const rowsToAppend = [];
            const rowsToUpdate = [];
            const rowNumbersToDelete = [...duplicateRowNumbers];
            let created = 0;
            let updated = 0;
            let unchanged = 0;

            for (const [key, firestoreRow] of firestoreRowsByKey.entries()) {
              const existingEntry = existingRowsByKey.get(key);

              const existingId = existingEntry ? existingIdForRow(headers, existingEntry.row) : "";
              const nextRow = buildRowFromData(headers, firestoreRow.data, existingId || firestoreRow.data.generatedId);

              if (!existingEntry) {
                rowsToAppend.push(nextRow);
                created += 1;
              } else if (rowFingerprint(existingEntry.row, headers.length) === rowFingerprint(nextRow, headers.length)) {
                unchanged += 1;
              } else {
                rowsToUpdate.push({ rowNumber: existingEntry.rowNumber, values: nextRow });
                updated += 1;
              }
            }

            const deletedKeys = [...existingRowsByKey.keys()].filter((key) => !firestoreRowsByKey.has(key));
            for (const key of deletedKeys) {
              rowNumbersToDelete.push(existingRowsByKey.get(key).rowNumber);
            }
            const deleted = deletedKeys.length;

            return {
              rowsToAppend,
              rowsToUpdate,
              rowNumbersToDelete,
              created,
              updated,
              deleted,
              unchanged,
              existingCount: existingRowsByKey.size,
              duplicateSheetRows,
            };
          }

          async function applySheetChanges(sheets, spreadsheetId, sheetName, sheetId, headers, changes) {
            const lastColumn = columnLetter(headers.length);

            if (changes.rowsToUpdate.length > 0) {
              await sheets.spreadsheets.values.batchUpdate({
                spreadsheetId,
                requestBody: {
                  valueInputOption: "USER_ENTERED",
                  data: changes.rowsToUpdate.map((change) => ({
                    range: `${sheetName}!A${change.rowNumber}:${lastColumn}${change.rowNumber}`,
                    values: [change.values],
                  })),
                },
              });
            }

            if (changes.rowsToAppend.length > 0) {
              await sheets.spreadsheets.values.append({
                spreadsheetId,
                range: `${sheetName}!A:${lastColumn}`,
                valueInputOption: "USER_ENTERED",
                insertDataOption: "INSERT_ROWS",
                requestBody: { values: changes.rowsToAppend },
              });
            }

            const uniqueRowsToDelete = [...new Set(changes.rowNumbersToDelete)].sort((a, b) => b - a);
            if (uniqueRowsToDelete.length > 0) {
              await sheets.spreadsheets.batchUpdate({
                spreadsheetId,
                requestBody: {
                  requests: uniqueRowsToDelete.map((rowNumber) => ({
                    deleteDimension: {
                      range: {
                        sheetId,
                        dimension: "ROWS",
                        startIndex: rowNumber - 1,
                        endIndex: rowNumber,
                      },
                    },
                  })),
                },
              });
            }

            return { deletedRowsApplied: uniqueRowsToDelete.length };
          }

          async function main() {
            if (!spreadsheetIdFromEnv) {
              throw new Error("PILOTLOG_SPREADSHEET_ID secret is required");
            }

            const firebaseServiceAccount = requiredJsonEnv("FIREBASE_SERVICE_ACCOUNT");
            const sheetsCredentials =
              process.env.GOOGLE_SHEETS_CREDENTIALS
                ? requiredJsonEnv("GOOGLE_SHEETS_CREDENTIALS")
                : requiredJsonEnv("GOOGLE_CALENDAR_CREDENTIALS");

            if (!admin.apps.length) {
              admin.initializeApp({
                credential: admin.credential.cert(firebaseServiceAccount),
              });
            }

            const auth = new google.auth.GoogleAuth({
              credentials: sheetsCredentials,
              scopes: [
                "https://www.googleapis.com/auth/spreadsheets",
              ],
            });

            const db = admin.firestore();
            const sheets = google.sheets({ version: "v4", auth });
            const spreadsheetId = spreadsheetIdFromEnv;
            const sheetId = await resolveSheetId(sheets, spreadsheetId, sheetName);

            const snapshot = await db.collection(collectionName).where("Email", "==", email).get();
            const existing = await sheets.spreadsheets.values.get({
              spreadsheetId,
              range: `${sheetName}!A1:AZ20000`,
              valueRenderOption: "FORMATTED_VALUE",
            });

            const existingRows = existing.data.values || [];
            const headers = existingRows[0] || [];
            if (!headers.length) {
              throw new Error(`${sheetName} header row is empty`);
            }

            const existingDataRows = existingRows.slice(2);
            const { rowsByKey: firestoreRowsByKey, duplicateFirestoreRows } = buildFirestoreRowsByKey(headers, snapshot.docs);
            const changes = mergeSheetRows(
              headers,
              existingDataRows,
              firestoreRowsByKey
            );
            const { deletedRowsApplied } = await applySheetChanges(sheets, spreadsheetId, sheetName, sheetId, headers, changes);

            console.log(
              [
                `Checked ${snapshot.size} ${collectionName} document(s) for ${email}`,
                `sheet existing rows=${changes.existingCount}`,
                `created=${changes.created}`,
                `updated=${changes.updated}`,
                `deleted=${changes.deleted}`,
                `unchanged=${changes.unchanged}`,
                `duplicate firestore rows removed=${duplicateFirestoreRows}`,
                `duplicate sheet rows removed=${changes.duplicateSheetRows}`,
                `sheet rows updated=${changes.rowsToUpdate.length}`,
                `sheet rows appended=${changes.rowsToAppend.length}`,
                `sheet rows deleted=${deletedRowsApplied}`,
                `target=${spreadsheetId}/${sheetName}`,
              ].join("; ")
            );
          }

          main().catch((error) => {
            console.error("Pilotlog sync failed:", error);
            process.exit(1);
          });
          NODE
