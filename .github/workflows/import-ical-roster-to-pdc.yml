name: Import iCal Roster to PDC

on:
  schedule:
    - cron: "0 0 * * *" # 매일 KST 09:00 = UTC 00:00
  workflow_dispatch:
    inputs:
      ical_roster_url:
        description: "Private webcal:// or https:// iCal roster URL"
        required: false
        type: string

      current_user_uid:
        description: "Firebase Authentication UID for roster owner"
        required: false
        type: string

      current_user_email:
        description: "Firebase Authentication email for roster owner"
        required: false
        type: string

      pdc_user_name:
        description: "Display name stored in pdc_user_name"
        required: false
        type: string

      import_source:
        description: "Internal caller marker. Slack imports must provide ical_roster_url and cannot fall back to repository secrets."
        required: false
        type: string

permissions:
  contents: read

jobs:
  import-ical-roster:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm install

      - name: Mask private iCal URL
        shell: bash
        env:
          INPUT_ICAL_URL: ${{ github.event.inputs.ical_roster_url }}
          SECRET_ICAL_URL: ${{ secrets.ICAL_ROSTER_URL }}
          SECRET_WEB_URL: ${{ secrets.WEB_ROSTER_URL }}
          SECRET_ROSTER_ICAL_URL: ${{ secrets.ROSTER_ICAL_URL }}
          SECRET_PDC_ICAL_URL: ${{ secrets.PDC_ICAL_ROSTER_URL }}
        run: |
          if [ -n "$INPUT_ICAL_URL" ]; then
            echo "::add-mask::$INPUT_ICAL_URL"
          fi

          if [ -n "$SECRET_ICAL_URL" ]; then
            echo "::add-mask::$SECRET_ICAL_URL"
          fi

          if [ -n "$SECRET_WEB_URL" ]; then
            echo "::add-mask::$SECRET_WEB_URL"
          fi

          if [ -n "$SECRET_ROSTER_ICAL_URL" ]; then
            echo "::add-mask::$SECRET_ROSTER_ICAL_URL"
          fi

          if [ -n "$SECRET_PDC_ICAL_URL" ]; then
            echo "::add-mask::$SECRET_PDC_ICAL_URL"
          fi

      - name: Check required iCal URL
        shell: bash
        env:
          INPUT_ICAL_URL: ${{ github.event.inputs.ical_roster_url }}
          IMPORT_SOURCE: ${{ github.event.inputs.import_source }}
          SECRET_ICAL_URL: ${{ secrets.ICAL_ROSTER_URL }}
          SECRET_WEB_URL: ${{ secrets.WEB_ROSTER_URL }}
          SECRET_ROSTER_ICAL_URL: ${{ secrets.ROSTER_ICAL_URL }}
          SECRET_PDC_ICAL_URL: ${{ secrets.PDC_ICAL_ROSTER_URL }}
        run: |
          if [ "$IMPORT_SOURCE" = "slack" ] && [ -z "$INPUT_ICAL_URL" ]; then
            echo "::error::Slack roster imports must include the user's personal iCal URL. Repository secret fallback is disabled for Slack imports."
            exit 1
          fi

          RESOLVED_ICAL_URL="${INPUT_ICAL_URL:-${SECRET_ICAL_URL:-${SECRET_WEB_URL:-${SECRET_ROSTER_ICAL_URL:-$SECRET_PDC_ICAL_URL}}}}"
          if [ -z "$RESOLVED_ICAL_URL" ]; then
            echo "::error::Missing iCal roster URL. For scheduled runs, add one repository secret: ICAL_ROSTER_URL, WEB_ROSTER_URL, ROSTER_ICAL_URL, or PDC_ICAL_ROSTER_URL. For manual runs, provide the ical_roster_url input."
            exit 1
          fi

      - name: Import iCal roster to pdc
        shell: bash
        env:
          INPUT_ICAL_URL: ${{ github.event.inputs.ical_roster_url }}
          IMPORT_SOURCE: ${{ github.event.inputs.import_source }}
          SECRET_ICAL_URL: ${{ secrets.ICAL_ROSTER_URL }}
          SECRET_WEB_URL: ${{ secrets.WEB_ROSTER_URL }}
          SECRET_ROSTER_ICAL_URL: ${{ secrets.ROSTER_ICAL_URL }}
          SECRET_PDC_ICAL_URL: ${{ secrets.PDC_ICAL_ROSTER_URL }}

          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

          FIREBASE_UID: ${{ github.event.inputs.current_user_uid || secrets.FIREBASE_UID || secrets.FIRESTORE_ADMIN_UID }}

          USER_ID: ${{ github.event.inputs.current_user_email || secrets.USER_ID }}
          USER_EMAIL: ${{ github.event.inputs.current_user_email || secrets.USER_ID }}

          PDC_USER_NAME: ${{ github.event.inputs.pdc_user_name || secrets.PDC_USER_NAME }}
          USER_NAME: ${{ github.event.inputs.pdc_user_name || secrets.PDC_USER_NAME }}

        run: |
          if [ "$IMPORT_SOURCE" = "slack" ]; then
            RESOLVED_ICAL_URL="$INPUT_ICAL_URL"
          else
            RESOLVED_ICAL_URL="${INPUT_ICAL_URL:-${SECRET_ICAL_URL:-${SECRET_WEB_URL:-${SECRET_ROSTER_ICAL_URL:-$SECRET_PDC_ICAL_URL}}}}"
          fi

          export INPUT_ICAL_ROSTER_URL="$RESOLVED_ICAL_URL"
          export ICAL_ROSTER_URL="$RESOLVED_ICAL_URL"
          export WEB_ROSTER_URL="$RESOLVED_ICAL_URL"
          node scripts/importIcalRosterToPdc.mjs
