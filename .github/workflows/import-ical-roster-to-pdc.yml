import-ical-roster-to-pdc.yml


name: Import iCal Roster to PDC

on:
  workflow_dispatch:
    inputs:
      ical_roster_url:
        description: "Private webcal:// or https:// iCal roster URL"
        required: false
        type: string

      current_user_uid:
        description: "Firebase Authentication UID if already known"
        required: false
        type: string

      current_user_email:
        description: "User email; Firebase Auth user is created automatically if missing"
        required: true
        type: string

      pdc_user_name:
        description: "Display name stored in pdc_user_name"
        required: false
        type: string

permissions:
  contents: read

jobs:
  import-ical-roster:
    name: Import iCal roster to PDC
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Validate and mask inputs
        shell: bash
        env:
          INPUT_ICAL_ROSTER_URL: ${{ inputs.ical_roster_url || secrets.ICAL_ROSTER_URL || secrets.WEB_ROSTER_URL }}
          CURRENT_USER_EMAIL: ${{ inputs.current_user_email }}
        run: |
          set -euo pipefail

          if [[ -z "$INPUT_ICAL_ROSTER_URL" ]]; then
            echo "::error::An iCal roster URL is required. Provide ical_roster_url or configure ICAL_ROSTER_URL/WEB_ROSTER_URL."
            exit 1
          fi

          if [[ -z "$CURRENT_USER_EMAIL" ]]; then
            echo "::error::current_user_email is required."
            exit 1
          fi

          echo "::add-mask::$INPUT_ICAL_ROSTER_URL"
          echo "Input validation completed."

      - name: Import iCal roster to PDC
        env:
          INPUT_ICAL_ROSTER_URL: ${{ inputs.ical_roster_url || secrets.ICAL_ROSTER_URL || secrets.WEB_ROSTER_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

          # Optional. When empty, the script resolves the user by email and
          # creates a Firebase Authentication user if none exists.
          FIREBASE_UID: ${{ inputs.current_user_uid }}

          # Required for Firebase Authentication lookup/automatic creation.
          USER_ID: ${{ inputs.current_user_email }}
          USER_EMAIL: ${{ inputs.current_user_email }}

          PDC_USER_NAME: ${{ inputs.pdc_user_name }}
          USER_NAME: ${{ inputs.pdc_user_name }}
        run: node scripts/importIcalRosterToPdc.mjs
