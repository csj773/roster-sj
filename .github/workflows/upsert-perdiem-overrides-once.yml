name: Upsert PerDiem Overrides Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upsert-perdiem-overrides-once.yml"

permissions:
  contents: read

jobs:
  upsert:
    if: contains(github.event.head_commit.message, '[upsert-perdiem-overrides-once]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm install

      - name: Upsert override rows
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/upsertSjchoiJuly2026PerdiemOverrides.mjs

      - name: Verify Slack PerDiem from Firestore pdc
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_UID: guest_email_sjchoi787_gmail_com
          PERDIEM_USER_NAME: sjchoi787@gmail.com
          PERDIEM_TARGET_MONTH: "7"
          PERDIEM_TARGET_YEAR: "2026"
        run: node scripts/slack_monthly_perdiem_report.mjs
