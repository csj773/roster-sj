name: Delete Firestore PDC Collection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/delete-pdc-collection.yml"
      - "scripts/deletePdcCollection.mjs"

permissions:
  contents: read

jobs:
  delete-pdc:
    if: contains(github.event.head_commit.message, '[delete-pdc-once]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm install

      - name: Delete Firestore pdc collection
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/deletePdcCollection.mjs
