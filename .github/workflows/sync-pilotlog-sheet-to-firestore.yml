name: Sync PILOTLOG flt_log to Firestore

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-pilotlog-sheet-to-firestore.yml"
  workflow_dispatch:
    inputs:
      target_start_date:
        description: "First flt_log DATE to sync"
        required: true
        default: "2023.4.29"
      target_end_date:
        description: "Last flt_log DATE to sync"
        required: true
        default: "2026.6.25"
      dry_run:
        description: "true = check only, false = update Firestore"
        required: true
        default: "false"
      target_flt:
        description: "Optional FLT to sync. Empty = all flights. Use comma for multiple flights."
        required: false
        default: ""

jobs:
  sync-sheet-to-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install sync dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm install --no-audit --no-fund

      - name: Update Firestore from PILOTLOG flt_log
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          PILOTLOG_SPREADSHEET_ID: ${{ secrets.PILOTLOG_SPREADSHEET_ID || '1mKjEd__zIoMJaa6CLmDE-wALGhtlG-USLTAiQBZnioc' }}
          PILOTLOG_SHEET_NAME: flt_log
          PILOTLOG_COLLECTION: Pilotlog
          PILOTLOG_EMAIL: sjchoi787@gmail.com
          TARGET_START_DATE: ${{ github.event.inputs.target_start_date || '2023.4.29' }}
          TARGET_END_DATE: ${{ github.event.inputs.target_end_date || '2026.6.25' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TARGET_FLT: ${{ github.event.inputs.target_flt || '' }}
        run: |
          node --input-type=module <<'NODE'
          import admin from "firebase-admin";
          import fs from "node:fs";
          import { google } from "googleapis";

          const spreadsheetId = process.env.PILOTLOG_SPREADSHEET_ID;
          const sheetName = process.env.PILOTLOG_SHEET_NAME || "flt_log";
          const collectionName = process.env.PILOTLOG_COLLECTION || "Pilotlog";
          const email = process.env.PILOTLOG_EMAIL || "sjchoi787@gmail.com";
          const targetStartDate = process.env.TARGET_START_DATE || "2023.4.29";
          const targetEndDate = process.env.TARGET_END_DATE || "2026.6.25";
          const targetFlts = String(process.env.TARGET_FLT || "")
            .split(",")
            .map((value) => normalizeFlightNumber(value))
            .filter(Boolean);
          const dryRun = String(process.env.DRY_RUN || "false").toLowerCase() === "true";
          const seedRows = fs.existsSync("work/seed/log_filled_seed.json")
            ? JSON.parse(fs.readFileSync("work/seed/log_filled_seed.json", "utf8"))
            : [];

          const RO_RI_DATETIME_START = new Date(Date.UTC(2026, 6, 1));

          const columnUpdates = [
            { header: "REG", field: "REG", type: "string" },
            { header: "DC", field: "DC", type: "string" },
            { header: "BLK", field: "BLK", type: "durationText" },
            { header: "NGT", field: "NT", type: "durationText" },
            { header: "INS", field: "INS", type: "durationText" },
            { header: "PIC", field: "PIC", type: "durationText" },
            { header: "이륙", field: "TKO", type: "integer" },
            { header: "착륙", field: "LDG", type: "integer" },
            { header: "RO", field: "RO", type: "datetime" },
            { header: "RI", field: "RI", type: "datetime" },
          ];

          function requiredJsonEnv(name) {
            const raw = process.env[name];
            if (!raw) throw new Error(`${name} secret is required`);
            const parsed = JSON.parse(raw);
            if (parsed.private_key) parsed.private_key = parsed.private_key.replace(/\\n/g, "\n");
            return parsed;
          }

          function normalizeFirestoreValue(value) {
            if (value == null) return "";
            if (typeof value.toDate === "function") return value.toDate();
            if (value instanceof Date) return value;
            return value;
          }

          function parseDateLike(value) {
            const normalized = normalizeFirestoreValue(value);
            if (!normalized) return null;
            if (normalized instanceof Date) return normalized;
            if (typeof normalized === "number") return new Date(Math.round((normalized - 25569) * 86400 * 1000));
            const nums = String(normalized).match(/\d+/g)?.map(Number) || [];
            if (nums.length >= 3) return new Date(Date.UTC(nums[0], nums[1] - 1, nums[2]));
            const parsed = new Date(normalized);
            return Number.isNaN(parsed.getTime()) ? null : parsed;
          }

          function normalizeDateKey(value) {
            const date = parseDateLike(value);
            if (!date) return String(value || "").replace(/\s+/g, "").replace(/\.$/, "");
            return `${date.getUTCFullYear()}.${date.getUTCMonth() + 1}.${date.getUTCDate()}`;
          }

          function dateSerial(value) {
            const date = parseDateLike(value);
            if (!date) return Number.NaN;
            return Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate());
          }

          function isDateInTargetRange(value) {
            const serial = dateSerial(value);
            if (Number.isNaN(serial)) return false;
            return serial >= dateSerial(targetStartDate) && serial <= dateSerial(targetEndDate);
          }

          function targetRangeLabel() {
            return `${targetStartDate}..${targetEndDate}`;
          }

          function valueByKeys(data, keys) {
            for (const key of keys) {
              if (data[key] != null && data[key] !== "") return data[key];
            }
            return "";
          }

          function normalizeFlightNumber(value) {
            return String(value || "").trim().replace(/^YP/i, "");
          }

          function shouldSyncFlight(value) {
            return !targetFlts.length || targetFlts.includes(normalizeFlightNumber(value));
          }

          function normalizeKeyPart(value) {
            return String(normalizeFirestoreValue(value) || "").trim().toUpperCase();
          }

          function flightKey(parts) {
            return [
              normalizeDateKey(parts.date),
              normalizeFlightNumber(parts.flt),
              normalizeKeyPart(parts.from),
              normalizeKeyPart(parts.to),
            ].join("|");
          }

          function dateFlightKey(parts) {
            return [
              normalizeDateKey(parts.date),
              normalizeFlightNumber(parts.flt),
            ].join("|");
          }

          function normalizeHeader(value) {
            return String(value || "").trim().replace(/\s+/g, "").toUpperCase();
          }

          function headerIndex(headers, name) {
            const normalizedName = normalizeHeader(name);
            return headers.findIndex((header) => normalizeHeader(header) === normalizedName);
          }

          function cellByHeader(headers, row, name) {
            const index = headerIndex(headers, name);
            return index >= 0 ? row[index] ?? "" : "";
          }

          function dateDistanceDays(left, right) {
            const leftDate = parseDateLike(left);
            const rightDate = parseDateLike(right);
            if (!leftDate || !rightDate) return Number.MAX_SAFE_INTEGER;
            return Math.abs(leftDate.getTime() - rightDate.getTime()) / 86400000;
          }

          function seedForSheetRow(row) {
            const flt = normalizeFlightNumber(row[3]);
            const from = normalizeKeyPart(row[4]);
            const to = normalizeKeyPart(row[5]);
            const candidates = seedRows
              .filter((seed) =>
                normalizeFlightNumber(seed.FLT) === flt &&
                normalizeKeyPart(seed.FROM) === from &&
                normalizeKeyPart(seed.TO) === to
              )
              .sort((a, b) => dateDistanceDays(a.DATE, row[2]) - dateDistanceDays(b.DATE, row[2]));
            return candidates[0] || {};
          }

          function normalizeIntegerValue(value) {
            if (value == null || value === "") return 0;
            if (typeof value === "number") return Math.trunc(value);
            const text = String(value).trim().replace(/[Oo]/g, "0");
            const parsed = Number.parseInt(text, 10);
            return Number.isNaN(parsed) ? 0 : parsed;
          }

          function normalizeDurationText(value) {
            if (value == null || value === "") return "0:00";
            if (typeof value === "number") {
              const totalMinutes = Math.round(value * 1440);
              const hours = Math.trunc(totalMinutes / 60);
              const minutes = Math.abs(totalMinutes % 60);
              return `${hours}:${String(minutes).padStart(2, "0")}`;
            }
            const text = String(value).trim();
            const match = text.match(/^(-?\d+):(\d{1,2})$/);
            if (match) {
              const hours = Number.parseInt(match[1], 10);
              const minutes = Number.parseInt(match[2], 10);
              return `${hours}:${String(minutes).padStart(2, "0")}`;
            }
            const parsed = Number.parseFloat(text.replace(/,/g, ""));
            if (Number.isNaN(parsed)) return "0:00";
            const totalMinutes = Math.round(parsed * 1440);
            const hours = Math.trunc(totalMinutes / 60);
            const minutes = Math.abs(totalMinutes % 60);
            return `${hours}:${String(minutes).padStart(2, "0")}`;
          }

          function normalizeStringValue(value) {
            if (value == null) return "";
            return String(value).trim();
          }

          function parseTimeValue(value) {
            if (value == null || value === "") return null;
            const text = String(value).trim();
            const match = text.match(/^(\d{1,2}):(\d{1,2})$/);
            return match ? { hours: Number.parseInt(match[1], 10), minutes: Number.parseInt(match[2], 10) } : null;
          }

          function combineDateAndTime(dateValue, timeValue) {
            const date = parseDateLike(dateValue);
            const time = parseTimeValue(timeValue);
            if (!date || !time) return null;
            return admin.firestore.Timestamp.fromDate(new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate(), time.hours, time.minutes)));
          }

          function seedValueForColumn(seed, field, header, fallbackHeaders) {
            for (const key of [field, header, ...fallbackHeaders]) {
              if (seed[key] != null && seed[key] !== "") return seed[key];
            }
            return "";
          }

          function buildUpdateForDoc(headers, data, row) {
            const update = {};
            const seed = seedForSheetRow(row);
            const rowDate = row[2];
            for (const { header, fallbackHeaders = [], field, type } of columnUpdates) {
              if (type === "datetime" && dateSerial(rowDate) < RO_RI_DATETIME_START.getTime()) continue;
              const values = [header, ...fallbackHeaders].map((name) => cellByHeader(headers, row, name));
              const sheetValue = values.find((value) => value !== "" && value != null) ?? "";
              const rawValue = sheetValue === "" || sheetValue == null
                ? seedValueForColumn(seed, field, header, fallbackHeaders)
                : sheetValue;
              if (type === "integer") {
                update[field] = normalizeIntegerValue(rawValue);
              } else if (type === "durationText") {
                update[field] = normalizeDurationText(rawValue);
              } else if (type === "string") {
                update[field] = normalizeStringValue(rawValue);
              } else if (type === "datetime") {
                const ts = combineDateAndTime(rowDate, rawValue);
                if (ts) update[field] = ts;
              } else {
                update[field] = rawValue;
              }
            }
            return update;
          }

          function buildSheetRows(rows) {
            return rows
              .slice(2)
              .filter((row) => isDateInTargetRange(row[2]))
              .filter((row) => shouldSyncFlight(row[3]))
              .map((row) => {
                return {
                  key: flightKey({ date: row[2], flt: row[3], from: row[4], to: row[5] }),
                  fallbackKey: dateFlightKey({ date: row[2], flt: row[3] }),
                  row,
                };
              })
              .filter((item) => item.key && item.key !== "|||");
          }

          function writeSortValue(doc) {
            const data = doc.data();
            const updated = data.updatedAt || data.UpdatedAt || data.updateTime;
            if (updated?.toDate) return updated.toDate().getTime();
            if (doc.updateTime?.toDate) return doc.updateTime.toDate().getTime();
            return 0;
          }

          function valueType(value) {
            if (value == null) return "empty";
            if (typeof value.toDate === "function") return "timestamp";
            if (Array.isArray(value)) return "array";
            return typeof value;
          }

          function valuePattern(value) {
            if (value == null || value === "") return "empty";
            const text = String(normalizeFirestoreValue(value)).trim();
            if (/^\d+$/.test(text)) return "integer-string";
            if (/^\d+:\d{1,2}$/.test(text)) return "duration-h:mm";
            if (/^\d{2}:\d{2}$/.test(text)) return "time-hh:mm";
            if (/^\d[A-Z]{2}$/.test(text)) return "dc-code";
            if (/^\d{4}$/.test(text)) return "four-digit";
            return "text";
          }

          function summarizeField(values) {
            const typeCounts = new Map();
            const patternCounts = new Map();
            let nonEmpty = 0;
            for (const value of values) {
              const type = valueType(value);
              const pattern = valuePattern(value);
              typeCounts.set(type, (typeCounts.get(type) || 0) + 1);
              patternCounts.set(pattern, (patternCounts.get(pattern) || 0) + 1);
              if (pattern !== "empty") nonEmpty += 1;
            }
            const dominant = (counts) =>
              [...counts.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] || "empty";
            return {
              nonEmpty,
              type: dominant(typeCounts),
              pattern: dominant(patternCounts),
              typeCounts: Object.fromEntries(typeCounts),
              patternCounts: Object.fromEntries(patternCounts),
            };
          }

          function compareWithOtherDocs(targetId, targetData, allDocs) {
            const fields = columnUpdates.map(({ field }) => field);
            const otherDocs = allDocs.filter((doc) => doc.id !== targetId).map((doc) => doc.data());
            const differences = [];
            for (const field of fields) {
              const targetValue = targetData[field];
              const summary = summarizeField(otherDocs.map((data) => data[field]));
              const targetSummary = {
                value: targetValue ?? "",
                type: valueType(targetValue),
                pattern: valuePattern(targetValue),
              };
              if (
                summary.nonEmpty > 0 &&
                (targetSummary.type !== summary.type || targetSummary.pattern !== summary.pattern)
              ) {
                differences.push({
                  field,
                  target: targetSummary,
                  otherDocs: summary,
                });
              }
            }
            return differences;
          }

          if (!admin.apps.length) {
            admin.initializeApp({
              credential: admin.credential.cert(requiredJsonEnv("FIREBASE_SERVICE_ACCOUNT")),
            });
          }

          const auth = new google.auth.GoogleAuth({
            credentials: requiredJsonEnv("GOOGLE_SHEETS_CREDENTIALS"),
            scopes: ["https://www.googleapis.com/auth/spreadsheets.readonly"],
          });

          const sheets = google.sheets({ version: "v4", auth });
          const db = admin.firestore();

          const sheetResponse = await sheets.spreadsheets.values.get({
            spreadsheetId,
            range: `${sheetName}!A1:AZ20000`,
            valueRenderOption: "UNFORMATTED_VALUE",
          });
          const sheetValues = sheetResponse.data.values || [];
          const headers = sheetValues[0] || [];
          const sheetRows = buildSheetRows(sheetValues);
          if (!sheetRows.length) throw new Error(`No flt_log rows found for ${targetRangeLabel()}`);

          const firestoreSnapshot = await db.collection(collectionName).where("Email", "==", email).get();
          const docsByKey = new Map();
          const docsByFallbackKey = new Map();
          let duplicateFirestoreDocs = 0;
          let duplicateFallbackDocs = 0;
          for (const doc of firestoreSnapshot.docs) {
            const data = doc.data();
            const date = valueByKeys(data, ["Date", "DATE", "date", "flightDate"]);
            const flt = valueByKeys(data, ["FLT", "F", "Activity", "flightNo"]);
            if (!isDateInTargetRange(date)) continue;
            if (!shouldSyncFlight(flt)) continue;
            const key = flightKey({
              date,
              flt,
              from: valueByKeys(data, ["FROM", "From", "from"]),
              to: valueByKeys(data, ["TO", "To", "to"]),
            });
            const fallbackKey = dateFlightKey({ date, flt });
            const existing = docsByKey.get(key);
            if (existing) {
              duplicateFirestoreDocs += 1;
              if (writeSortValue(existing) > writeSortValue(doc)) continue;
            }
            docsByKey.set(key, doc);

            const existingFallback = docsByFallbackKey.get(fallbackKey);
            if (existingFallback) {
              duplicateFallbackDocs += 1;
              if (writeSortValue(existingFallback) > writeSortValue(doc)) continue;
            }
            docsByFallbackKey.set(fallbackKey, doc);
          }

          let matched = 0;
          let fallbackMatched = 0;
          let missing = 0;
          const updatedDocRefs = [];
          let batch = db.batch();
          let batchWrites = 0;

          async function commitBatch(force = false) {
            if (dryRun || batchWrites === 0) return;
            if (!force && batchWrites < 450) return;
            await batch.commit();
            batch = db.batch();
            batchWrites = 0;
          }

          for (const sheetRow of sheetRows) {
            const doc = docsByKey.get(sheetRow.key) || docsByFallbackKey.get(sheetRow.fallbackKey);
            if (!doc) {
              missing += 1;
              console.log(`Missing Firestore doc for ${sheetRow.key} fallback=${sheetRow.fallbackKey}`);
              continue;
            }
            matched += 1;
            if (!docsByKey.has(sheetRow.key)) fallbackMatched += 1;
            const update = buildUpdateForDoc(headers, doc.data(), sheetRow.row);
            console.log(`${dryRun ? "Would update" : "Updating"} ${doc.id} ${sheetRow.key}`, update);
            if (!dryRun) {
              batch.update(doc.ref, {
                ...update,
                sheetSyncUpdatedAt: admin.firestore.FieldValue.serverTimestamp(),
                sheetSyncSource: `${sheetName} ${targetRangeLabel()} REG,DC,BLK,NGT,INS,PIC,이륙,착륙,RO,RI`,
              });
              batchWrites += 1;
              updatedDocRefs.push(doc.ref);
              await commitBatch();
            }
          }

          await commitBatch(true);

          if (!dryRun) {
            for (const ref of updatedDocRefs) {
              const snap = await ref.get();
              const data = snap.data() || {};
              console.log(`After update ${snap.id}`, {
                REG: data.REG ?? "",
                DC: data.DC ?? "",
                BLK: data.BLK ?? "",
                NGT: data.NGT ?? "",
                INS: data.INS ?? "",
                TKO: data.TKO ?? "",
                LDG: data.LDG ?? "",
                PIC: data.PIC ?? "",
                RO: data.RO ?? "",
                RI: data.RI ?? "",
              });
              const differences = compareWithOtherDocs(snap.id, data, firestoreSnapshot.docs);
              if (differences.length) {
                console.log(`Format differences for ${snap.id}`, JSON.stringify(differences, null, 2));
              } else {
                console.log(`Format differences for ${snap.id}: none`);
              }
            }
          }

          console.log(
            [
              `target_start_date=${targetStartDate}`,
              `target_end_date=${targetEndDate}`,
              `target_flt=${targetFlts.length ? targetFlts.join(",") : "*"}`,
              `dry_run=${dryRun}`,
              `sheet_rows=${sheetRows.length}`,
              `matched_docs=${matched}`,
              `fallback_matched_docs=${fallbackMatched}`,
              `missing_docs=${missing}`,
              `duplicate_firestore_docs=${duplicateFirestoreDocs}`,
              `duplicate_fallback_docs=${duplicateFallbackDocs}`,
            ].join("; ")
          );
          NODE

