name: Update Roster & Google Calendar

 Calendaron:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      username:
        description: "CrewConnex username"
        required: false
        type: string
      password:
        description: "CrewConnex password"
        required: false
        type: string
      current_user_uid:
        description: "Firebase Authentication UID for roster owner"
        required: false
        type: string
      current_user_email:
        description: "Firebase Authentication email for roster email"
        required: false
        type: string

permissions:
  contents: read

env:
  FIRESTORE_ADMIN_UID: ${{ secrets.FIRESTORE_ADMIN_UID }}
  firestoreAdminUid: ${{ secrets.FIRESTORE_ADMIN_UID }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Mask workflow input password
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.password != '' }}
        run: echo "::add-mask::${{ github.event.inputs.password }}"

      - name: Run roster and PerDiem processing
        env:
          CHROME_PATH: "/usr/bin/chromium-browser"

          INPUT_PDC_USERNAME: ${{ github.event.inputs.username || secrets.PDC_USERNAME }}
          INPUT_PDC_PASSWORD: ${{ github.event.inputs.password || secrets.PDC_PASSWORD }}

          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

          FIREBASE_UID: ${{ github.event.inputs.current_user_uid || secrets.FIREBASE_UID || secrets.FIRESTORE_ADMIN_UID }}
          INPUT_FIREBASE_UID: ${{ github.event.inputs.current_user_uid || secrets.FIREBASE_UID || secrets.FIRESTORE_ADMIN_UID }}
          INPUT_ADMIN_FIREBASE_UID: ${{ github.event.inputs.current_user_uid || secrets.FIREBASE_UID || secrets.FIRESTORE_ADMIN_UID }}
          FIRESTORE_ADMIN_UID: ${{ github.event.inputs.current_user_uid || secrets.FIREBASE_UID || secrets.FIRESTORE_ADMIN_UID }}
          firestoreAdminUid: ${{ github.event.inputs.current_user_uid || secrets.FIREBASE_UID || secrets.FIRESTORE_ADMIN_UID }}
          PERDIEM_OWNER: ${{ github.event.inputs.current_user_uid || secrets.FIREBASE_UID || secrets.FIRESTORE_ADMIN_UID }}
          PERDIEM_USER_ID: ${{ github.event.inputs.current_user_uid || secrets.FIREBASE_UID || secrets.FIRESTORE_ADMIN_UID }}

          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}

          USER_ID: ${{ github.event.inputs.current_user_email || secrets.USER_ID }}

        run: node -r dotenv/config roster.js

      - name: Verify generated roster and PerDiem files
        run: |
          test -s public/roster.json
          test -s public/roster.csv
          test -s public/perdiem.csv
          echo "Generated files are available only inside this workflow run."

      - name: Run Google Calendar update
        env:
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CALENDAR_CREDENTIALS: ${{ secrets.GOOGLE_CALENDAR_CREDENTIALS }}
        run: node -r dotenv/config gcal.js
