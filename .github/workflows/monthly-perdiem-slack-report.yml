name: Monthly PerDiem Slack Report

on:
  workflow_dispatch:
    inputs:
      current_user_uid:
        description: "Firebase Authentication UID for the Slack user"
        required: true
        type: string

      current_user_email:
        description: "Email address for the PerDiem owner"
        required: false
        type: string

      current_user_name:
        description: "Display name for the Slack report"
        required: false
        type: string

      target_month:
        description: "Target month: Jul, July, 7, or 07"
        required: false
        type: string

      target_year:
        description: "Target year, for example 2026"
        required: false
        type: string

      slack_response_url:
        description: "Slack delayed response_url"
        required: false
        type: string

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Mask Slack response URL
        if: ${{ inputs.slack_response_url != '' }}
        run: echo "::add-mask::${{ inputs.slack_response_url }}"

      - name: Post monthly PerDiem report to Slack
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

          # 1순위: 입력받은 Firebase UID
          REPORT_OWNER_UID: ${{ inputs.current_user_uid }}

          # UID 대신 이메일로 조회할 때 사용
          REPORT_OWNER_EMAIL: ${{ inputs.current_user_email }}

          # UID와 이메일이 모두 없을 때 fallback
          FIRESTORE_ADMIN_UID: ${{ secrets.FIRESTORE_ADMIN_UID }}

          REPORT_MONTH: ${{ inputs.target_month }}
          REPORT_YEAR: ${{ inputs.target_year }}

          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

          SLACK_RESPONSE_URL: ${{ inputs.slack_response_url }}

          PERDIEM_COLLECTION: "Perdiem"
          USER_COLLECTION: "users"
          OUTPUT_DIR: "outputs"

        run: node scripts/slack_monthly_perdiem_report.mjs

      - name: Upload generated report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-perdiem-report
          path: |
            outputs/*.csv
            outputs/*.json
          if-no-files-found: warn
          retention-days: 30
