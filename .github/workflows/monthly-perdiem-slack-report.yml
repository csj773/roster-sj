name: Monthly PerDiem Slack Report

on:
  workflow_dispatch:
    inputs:
      current_user_uid:
        description: "Firebase Authentication UID for the Slack user"
        required: true
        type: string
      current_user_name:
        description: "Display name for the Slack report"
        required: false
        type: string
      target_month:
        description: "Target month number, 1-12. Defaults to current/previous KST month."
        required: false
        type: string
      target_year:
        description: "Target year. Defaults to KST target year."
        required: false
        type: string
      slack_response_url:
        description: "Slack delayed response_url"
        required: true
        type: string

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm install

      - name: Mask Slack response URL
        run: echo "::add-mask::${{ inputs.slack_response_url }}"

      - name: Post monthly PerDiem report to Slack
        env:
          PERDIEM_OWNER: ${{ secrets.FIRESTORE_ADMIN_UID }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_UID: ${{ inputs.current_user_uid }}
          PERDIEM_USER_NAME: ${{ inputs.current_user_name }}
          PERDIEM_TARGET_MONTH: ${{ inputs.target_month }}
          PERDIEM_TARGET_YEAR: ${{ inputs.target_year }}
          SLACK_RESPONSE_URL: ${{ inputs.slack_response_url }}
        run: node scripts/slack_monthly_perdiem_report.mjs
