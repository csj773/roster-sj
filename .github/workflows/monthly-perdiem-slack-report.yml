name: Monthly PerDiem Slack Report

on:
  workflow_dispatch:
    inputs:
      current_user_uid:
        description: "Firebase Authentication UID for the Slack user"
        required: true
        type: string

      current_user_email:
        description: "Firebase Authentication email for the Slack user"
        required: false
        type: string

      current_user_name:
        description: "Display name for the Slack report"
        required: false
        type: string

      target_month:
        description: "Target month number, 1-12. Defaults to current/previous KST month."
        required: false
        type: string

      target_year:
        description: "Target year. Defaults to KST target year."
        required: false
        type: string

      slack_response_url:
        description: "Slack delayed response_url"
        required: true
        type: string

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Mask Slack response URL
        run: echo "::add-mask::${{ inputs.slack_response_url }}"

      - name: Post monthly PerDiem report to Slack
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

          # 조회 대상 사용자
          PERDIEM_OWNER: ${{ inputs.current_user_uid }}
          REPORT_OWNER_UID: ${{ inputs.current_user_uid }}
          FIREBASE_UID: ${{ inputs.current_user_uid }}
          PERDIEM_USER_ID: ${{ inputs.current_user_uid }}

          REPORT_OWNER_EMAIL: ${{ inputs.current_user_email }}
          PERDIEM_USER_EMAIL: ${{ inputs.current_user_email }}
          USER_ID: ${{ inputs.current_user_email }}

          PERDIEM_USER_NAME: ${{ inputs.current_user_name }}
          PERDIEM_TARGET_MONTH: ${{ inputs.target_month }}
          PERDIEM_TARGET_YEAR: ${{ inputs.target_year }}

          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_RESPONSE_URL: ${{ inputs.slack_response_url }}

          FORCE_PERDIEM_REPORT: "true"

        run: node scripts/slack_monthly_perdiem_report.mjs

      - name: Upload generated report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-perdiem-report
          path: |
            outputs/*.csv
            outputs/*.json
          if-no-files-found: warn
          retention-days: 30
