name: Monthly PerDiem Report

on:
  schedule:
    # KST 00:10 on the 29th-1st window.
    # The script sends only on KST day 1,
    # so this creates the previous-month report.
    - cron: "10 15 28-31 * *"

  workflow_dispatch:
    inputs:
      target_month:
        description: "Target month number, 1-12. Defaults to previous/current KST month."
        required: false
        type: string

      target_year:
        description: "Target year. Defaults to KST target year."
        required: false
        type: string

      current_user_uid:
        description: "PerdiemEvents Owner / Firebase UID"
        required: false
        type: string

      current_user_email:
        description: "Optional user email"
        required: false
        type: string

      current_user_name:
        description: "Optional display name"
        required: false
        type: string

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # --------------------------------------------------
      # 2. Node.js
      # --------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm install

      # --------------------------------------------------
      # 4. Firestore PerdiemEvents
      #    →
      #    Google Sheets Perdiem
      #    →
      #    CSV / JSON
      # --------------------------------------------------
      - name: Build monthly PerDiem report
        env:
          # Firebase / Firestore
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

          # Google Sheets
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEETS_SPREADSHEET_ID: 1mKjEd__zIoMJaa6CLmDE-wALGhtlG-USLTAiQBZnioc

          # Firestore source
          PERDIEM_EVENTS_COLLECTION: "PerdiemEvents"
          PERDIEM_SHEET_NAME: "Perdiem"

          # User identity
          PERDIEM_OWNER: ${{ inputs.current_user_uid || secrets.FIRESTORE_ADMIN_UID }}
          REPORT_OWNER_UID: ${{ inputs.current_user_uid || secrets.FIRESTORE_ADMIN_UID }}
          FIREBASE_UID: ${{ inputs.current_user_uid || secrets.FIRESTORE_ADMIN_UID }}
          PERDIEM_USER_ID: ${{ inputs.current_user_uid || secrets.PERDIEM_USER_ID }}

          PERDIEM_USER_EMAIL: ${{ inputs.current_user_email }}
          PERDIEM_USER_NAME: ${{ inputs.current_user_name }}

          # Target period
          PERDIEM_TARGET_MONTH: ${{ inputs.target_month }}
          PERDIEM_TARGET_YEAR: ${{ inputs.target_year }}

          # Force report during manual execution
          FORCE_PERDIEM_REPORT: ${{ github.event_name == 'workflow_dispatch' }}

          # GitHub event
          GITHUB_EVENT_NAME: ${{ github.event_name }}

        run: node scripts/monthly_perdiem_report.mjs

      # --------------------------------------------------
      # 5. Convert CSV → Excel
      # --------------------------------------------------
      - name: Convert PerDiem report to Excel
        run: |
          python -m pip install --upgrade openpyxl

          python - <<'PY'
          import csv
          import glob
          from pathlib import Path

          from openpyxl import Workbook
          from openpyxl.styles import Font, PatternFill
          from openpyxl.utils import get_column_letter

          csv_files = sorted(
              glob.glob("outputs/Perdiem_*.csv")
          )

          if not csv_files:
              print(
                  "No PerDiem CSV generated; "
                  "skipping Excel conversion."
              )
              raise SystemExit(0)

          csv_path = Path(csv_files[-1])
          xlsx_path = csv_path.with_suffix(".xlsx")

          wb = Workbook()
          ws = wb.active
          ws.title = "Perdiem"

          with csv_path.open(
              newline="",
              encoding="utf-8",
          ) as handle:
              for row in csv.reader(handle):
                  ws.append(row)

          # Header formatting
          header_fill = PatternFill(
              "solid",
              fgColor="D9EAF7",
          )

          for cell in ws[1]:
              cell.font = Font(bold=True)
              cell.fill = header_fill

          # Numeric conversion
          for row in ws.iter_rows():
              for cell in row:
                  if isinstance(cell.value, str):
                      raw = cell.value.strip()

                      if not raw:
                          continue

                      try:
                          if raw.replace(
                              ".", "", 1
                          ).isdigit():
                              cell.value = (
                                  float(raw)
                                  if "." in raw
                                  else int(raw)
                              )
                      except Exception:
                          pass

          # Column widths
          for column_cells in ws.columns:
              width = (
                  max(
                      len(
                          str(
                              cell.value or ""
                          )
                      )
                      for cell in column_cells
                  )
                  + 2
              )

              ws.column_dimensions[
                  get_column_letter(
                      column_cells[0].column
                  )
              ].width = min(
                  width,
                  24,
              )

          wb.save(xlsx_path)

          print(
              f"Wrote {xlsx_path}"
          )
          PY

      # --------------------------------------------------
      # 6. Upload Excel artifact
      # --------------------------------------------------
      - name: Upload PerDiem report artifact
        uses: actions/upload-artifact@v6
        with:
          name: monthly-perdiem-report
          path: |
            outputs/Perdiem_*.xlsx
            outputs/Perdiem_*.csv
            outputs/Perdiem_*.json
          if-no-files-found: ignore

      # --------------------------------------------------
      # 7. Send Gmail
      # --------------------------------------------------
      - name: Send Gmail delivery
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PERDIEM_EMAIL_TO: sjchoi787@gmail.com

        run: |
          python - <<'PY'
          import glob
          import json
          import os
          import smtplib

          from email.message import EmailMessage
          from pathlib import Path

          xlsx_files = sorted(
              glob.glob(
                  "outputs/Perdiem_*.xlsx"
              )
          )

          summary_files = sorted(
              glob.glob(
                  "outputs/Perdiem_*.json"
              )
          )

          if not xlsx_files:
              print(
                  "No PerDiem Excel report "
                  "file generated; "
                  "skipping email."
              )
              raise SystemExit(0)

          if not summary_files:
              raise RuntimeError(
                  "PerDiem summary JSON missing"
              )

          xlsx_path = Path(
              xlsx_files[-1]
          )

          summary = json.loads(
              Path(
                  summary_files[-1]
              ).read_text(
                  encoding="utf-8"
              )
          )

          sender = os.environ[
              "GMAIL_USERNAME"
          ]

          password = os.environ[
              "GMAIL_APP_PASSWORD"
          ]

          recipient = os.environ.get(
              "PERDIEM_EMAIL_TO",
              "sjchoi787@gmail.com",
          )

          msg = EmailMessage()

          msg["From"] = sender
          msg["To"] = recipient

          msg["Subject"] = (
              f"PerDiem report "
              f"{summary['month']} "
              f"{summary['year']}"
          )

          msg.set_content(
              "\n".join(
                  [
                      (
                          "PerDiem monthly "
                          "report for "
                          f"{summary['month']} "
                          f"{summary['year']}."
                      ),
                      "",
                      (
                          f"Firestore Rows: "
                          f"{summary.get('firestoreRows', 0)}"
                      ),
                      (
                          f"Rows: "
                          f"{summary['rows']}"
                      ),
                      (
                          "Duplicates Removed: "
                          f"{summary.get('duplicatesRemoved', 0)}"
                      ),
                      (
                          f"Total PerDiem: "
                          f"{summary['totalPerdiem']:.2f}"
                      ),
                      (
                          "Transport Fee Total: "
                          f"{summary['totalTransportFee']:.2f}"
                      ),
                      (
                          f"Grand Total: "
                          f"{summary['grandTotal']:.2f}"
                      ),
                  ]
              )
          )

          msg.add_attachment(
              xlsx_path.read_bytes(),
              maintype="application",
              subtype=(
                  "vnd.openxmlformats-"
                  "officedocument."
                  "spreadsheetml.sheet"
              ),
              filename=xlsx_path.name,
          )

          with smtplib.SMTP_SSL(
              "smtp.gmail.com",
              465,
          ) as smtp:

              smtp.login(
                  sender,
                  password,
              )

              smtp.send_message(msg)

          print(
              f"Sent {xlsx_path.name} "
              f"to {recipient}"
          )
          PY