<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roster Share</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #182026;
        --muted: #66717c;
        --line: #dfe5ea;
        --surface: #f6f8fa;
        --accent: #0f7b6c;
        --accent-strong: #095f53;
        --warn: #995d13;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--surface);
        color: var(--ink);
      }

      main {
        width: min(100%, 480px);
        background: white;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 18px 50px rgba(24, 32, 38, 0.08);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 25px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.55;
      }

      .code {
        margin: 22px 0;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfd;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 15px;
        overflow-wrap: anywhere;
      }

      .actions {
        display: grid;
        gap: 10px;
        margin-top: 20px;
      }

      a,
      button {
        min-height: 44px;
        border-radius: 8px;
        border: 1px solid var(--accent);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        font: inherit;
        font-weight: 650;
        text-decoration: none;
        cursor: pointer;
      }

      a.primary {
        background: var(--accent);
        color: white;
      }

      a.primary:hover {
        background: var(--accent-strong);
      }

      button {
        background: white;
        color: var(--accent);
      }

      .empty {
        color: var(--warn);
      }

      .status {
        min-height: 22px;
        margin-top: 12px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Roster Share</h1>
      <p id="summary">초대 링크를 확인하고 있습니다.</p>
      <div class="code" id="inviteCode">invite loading...</div>
      <div class="actions">
        <a class="primary" id="openApp" href="https://logbook-tljs60.flutterflow.app/auth3">앱에서 참여하기</a>
        <button id="copyCode" type="button">초대 코드 복사</button>
        <button id="copyLink" type="button">링크 복사</button>
      </div>
      <p class="status" id="status"></p>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const invite = params.get("invite") || "";
      const summary = document.getElementById("summary");
      const inviteCode = document.getElementById("inviteCode");
      const openApp = document.getElementById("openApp");
      const status = document.getElementById("status");
      const appUrl = new URL("https://logbook-tljs60.flutterflow.app/auth3");

      if (invite) {
        appUrl.searchParams.set("invite", invite);
        openApp.href = appUrl.toString();
        inviteCode.textContent = invite;
        summary.textContent = "로그인 후 이 초대 코드로 roster 공유에 참여할 수 있습니다.";
      } else {
        inviteCode.textContent = "초대 코드가 없습니다.";
        inviteCode.classList.add("empty");
        summary.textContent = "링크에 invite 파라미터가 포함되어 있는지 확인해 주세요.";
      }

      async function copy(text, label) {
        if (!text) return;
        await navigator.clipboard.writeText(text);
        status.textContent = `${label} 복사했습니다.`;
      }

      document.getElementById("copyCode").addEventListener("click", () => copy(invite, "초대 코드"));
      document.getElementById("copyLink").addEventListener("click", () => copy(window.location.href, "링크"));
    </script>
  </body>
</html>
