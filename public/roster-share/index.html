<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roster Share</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #182026;
        --muted: #66717c;
        --line: #dfe5ea;
        --surface: #f6f8fa;
        --accent: #0f7b6c;
        --accent-strong: #095f53;
        --secondary: #1f5f99;
        --warn: #995d13;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--surface);
        color: var(--ink);
      }

      main {
        width: min(100%, 480px);
        background: white;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 18px 50px rgba(24, 32, 38, 0.08);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 25px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.55;
      }

      .code {
        margin: 22px 0;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfd;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 15px;
        overflow-wrap: anywhere;
      }

      .actions {
        display: grid;
        gap: 10px;
        margin-top: 20px;
      }

      a,
      button {
        min-height: 44px;
        border-radius: 8px;
        border: 1px solid var(--accent);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        font: inherit;
        font-weight: 650;
        text-decoration: none;
        cursor: pointer;
      }

      .primary {
        background: var(--accent);
        color: white;
      }

      .primary:hover {
        background: var(--accent-strong);
      }

      .secondary {
        border-color: var(--secondary);
        color: var(--secondary);
        background: white;
      }

      button {
        background: white;
        color: var(--accent);
      }

      .empty {
        color: var(--warn);
      }

      .status {
        min-height: 22px;
        margin-top: 12px;
        font-size: 14px;
      }

      .status.ok {
        color: var(--accent-strong);
      }

      .status.error {
        color: var(--warn);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Roster Share</h1>
      <p id="summary">초대 링크를 확인하고 있습니다.</p>
      <div class="code" id="inviteCode">invite loading...</div>
      <div class="actions">
        <button class="primary" id="acceptInvite" type="button">수락하기</button>
        <button class="secondary" id="checkStatus" type="button">수락 여부 확인</button>
        <button id="copyCode" type="button">초대 코드 복사</button>
        <button id="copyLink" type="button">링크 복사</button>
      </div>
      <p class="status" id="status"></p>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const invite = params.get("invite") || "";
      const mode = params.get("mode") || "";
      const summary = document.getElementById("summary");
      const inviteCode = document.getElementById("inviteCode");
      const acceptInvite = document.getElementById("acceptInvite");
      const checkStatus = document.getElementById("checkStatus");
      const status = document.getElementById("status");

      if (invite) {
        inviteCode.textContent = invite;
        summary.textContent =
          mode === "status"
            ? "이 초대의 수락 여부를 확인할 수 있습니다."
            : "초대 코드를 가진 사람은 로그인 없이 roster 공유를 수락할 수 있습니다.";
      } else {
        inviteCode.textContent = "초대 코드가 없습니다.";
        inviteCode.classList.add("empty");
        summary.textContent = "링크에 invite 파라미터가 포함되어 있는지 확인해 주세요.";
        acceptInvite.disabled = true;
        checkStatus.disabled = true;
      }

      async function copy(text, label) {
        if (!text) return;
        await navigator.clipboard.writeText(text);
        setStatus(`${label} 복사했습니다.`, "ok");
      }

      function setStatus(message, type = "") {
        status.textContent = message;
        status.className = `status ${type}`.trim();
      }

      async function postAccept() {
        if (!invite) return;
        acceptInvite.disabled = true;
        setStatus("초대를 수락하고 있습니다.", "");
        try {
          const response = await fetch("/api/acceptShareInviteByCode", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ inviteCode: invite }),
          });
          const data = await response.json();
          if (!response.ok || !data.ok) throw new Error(data.error || "수락에 실패했습니다.");
          setStatus(data.alreadyAccepted ? "이미 수락된 초대입니다." : "수락 완료했습니다.", "ok");
          summary.textContent = "Roster Share 초대가 수락되었습니다.";
        } catch (error) {
          setStatus(error.message, "error");
          acceptInvite.disabled = false;
        }
      }

      async function fetchStatus() {
        if (!invite) return;
        setStatus("수락 여부를 확인하고 있습니다.", "");
        try {
          const response = await fetch(`/api/publicShareInviteStatus?invite=${encodeURIComponent(invite)}`);
          const data = await response.json();
          if (!response.ok || !data.ok) throw new Error(data.error || "상태 확인에 실패했습니다.");
          const confirmedAt = data.confirmedAt ? ` (${new Date(data.confirmedAt).toLocaleString()})` : "";
          const message = data.confirmed
            ? `수락 완료${confirmedAt}`
            : `현재 상태: ${data.status}, confirmation: ${data.confirmationStatus}`;
          setStatus(message, data.confirmed ? "ok" : "");
          if (data.confirmed) summary.textContent = "Roster Share 초대가 수락되었습니다.";
        } catch (error) {
          setStatus(error.message, "error");
        }
      }

      acceptInvite.addEventListener("click", postAccept);
      checkStatus.addEventListener("click", fetchStatus);
      document.getElementById("copyCode").addEventListener("click", () => copy(invite, "초대 코드"));
      document.getElementById("copyLink").addEventListener("click", () => copy(window.location.href, "링크"));
      if (invite && mode === "status") fetchStatus();
    </script>
  </body>
</html>
